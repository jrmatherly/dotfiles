]

# ---------- built-ins ----------

[[builtin]]
name = "code-review"
desc = "Review the current diff, a PR, branch or path for correctness bugs, at effort low/medium/high/max, or 'ultra' for a multi-agent cloud review. --comment posts inline PR comments; --fix applies the findings."
[[builtin]]
name = "simplify"
desc = "Review changed code for reuse, simplification and efficiency, then apply the fixes. Quality only; it does not hunt for bugs."
[[builtin]]
name = "security-review"
desc = "Security-focused review of pending changes on the current branch."
[[builtin]]
name = "init"
desc = "Create a CLAUDE.md that documents the codebase."
[[builtin]]
name = "run"
desc = "Launch and drive this project's app to see a change working (CLI, server, TUI, Electron, browser)."
[[builtin]]
name = "loop"
desc = "Run a prompt or slash command on a recurring interval (e.g. /loop 5m /foo), or let the model pace itself."
[[builtin]]
name = "schedule"
desc = "Create or manage scheduled cloud agents (routines) on a cron schedule, or as one-off timed runs."
[[builtin]]
name = "fewer-permission-prompts"
desc = "Scan transcripts for common read-only calls and add an allowlist to .claude/settings.json."
[[builtin]]
name = "update-config"
desc = "Edit settings.json: hooks ('whenever X, do Y'), permissions, env vars."
[[builtin]]
name = "keybindings-help"
desc = "Customize keyboard shortcuts in ~/.claude/keybindings.json."
[[builtin]]
name = "claude-api"
desc = "Reference for the Claude API / Anthropic SDK: model IDs, pricing, tool use, caching, streaming, agents."
[[builtin]]
name = "claude-in-chrome"
desc = "Drive your own Chrome through the Claude extension: click, fill forms, screenshot, read the console. Needs per-site permission."
[[builtin]]
name = "dataviz"
desc = "Design rules for any chart, graph or dashboard: form choice, accessible palette, marks, interaction."
[[builtin]]
name = "artifact-design"
desc = "Design contract for publishing an HTML page as a claude.ai Artifact."
[[builtin]]
name = "artifact-diagramming"
