# Hand-written layer for build_catalog.py. Survives re-runs.
#   [[builtin]]     things that ship with Claude Code (not discoverable from files)
#   [[connector]]   claude.ai connectors (configured in the claude.ai account, not on disk)
#   [mcp.<name>]    description + tool summary for an MCP server found on disk
#   [notes]         extra "use when / don't confuse with" note for any item, by exact name
#   [[group]]       task guide: overlapping options for one job, with a default pick
# The build fails (exit 1) if a group or note names something that isn't installed.

intro = """
Every skill, slash command, subagent and MCP server available to Claude Code on this machine.
Start with the task guide: it covers the areas where several tools overlap and says which one to use.
"""

# ---------- internal helpers ----------
# Run by their own plugin (or by a hook); not meant to be invoked directly. Hidden with the "hide" switch.
