# ---------- cleanup ----------
# Thresholds for flagging a PLUGIN (the unit you can actually remove) as a cleanup candidate.
# review = unused >= unused_days AND >= unused_sessions, no ★ pick, and
#          (always-on tokens >= cost_tokens OR share of alternatives/duplicates >= overlap_ratio)
# watch  = meets the cost/overlap part but was used recently or is too new to judge.
[cleanup]
unused_days = 14        # same rule /plugin uses for "Not used recently"
unused_sessions = 10
cost_tokens = 1000
overlap_ratio = 0.8

# Items that do the same job as another item: "duplicate" = "the one to keep".
[duplicates]
"anthropic-skills:skill-creator" = "skill-creator:skill-creator"   # identical file (claude.ai-synced copy)
"code-review:code-review" = "code-review"                           # plugin version, superseded by the built-in
"pr-review-toolkit:code-simplifier" = "code-simplifier:code-simplifier"

# Your decisions per plugin. status = "keep" | "review" | "retire"; retire hides it and tells AI to avoid it.
# Removing: claude plugin disable <name>@<marketplace>  (or uninstall). Example:
#   [plugin_status.voltagent-domains]
#   status = "retire"
#   reason = "healthcare/fintech/blockchain agents not relevant to my work"
[plugin_status]

# Individual items to retire. Personal/built-in skills can really be turned off (a skillOverrides
# snippet is generated); plugin items can't be removed one by one, so this only hides them. Example:
#   "two-factor-authentication-best-practices" = "not using Better Auth 2FA"
[retire]

