pick = ["superpowers:brainstorming", "superpowers:writing-plans"]
guide = "Three separate methods; pick one per task. superpowers: brainstorm → write plan → execute. feature-dev: one guided command. PIV (skills:*): PRD → architecture → plan → implement → validate → commit → PR."
