# ---------- MCP servers ----------

[mcp.codegraph]
desc = "SQLite code knowledge graph. One call returns a symbol's source plus its call paths and blast radius. Only in repos with a .codegraph/ dir; try it BEFORE grep."
tools = "codegraph_explore (pass projectPath for other repos)"
[mcp.serena]
desc = "LSP-backed semantic code navigation and symbol-level editing, plus project memories. Launched with --project-from-cwd, so don't call activate_project."
tools = "find_symbol, find_referencing_symbols, get_symbols_overview, replace_symbol_body, insert_before/after_symbol, rename_symbol, safe_delete_symbol, *_memory"
[mcp.mise]
desc = "mise tool/task manager: list and run tasks, install tool versions, read env/config."
tools = "list_commands (check effects first), run_task, install_tool"
[mcp.astro-docs]
desc = "Search the official Astro framework docs."
tools = "search_astro_docs"
[mcp.better-auth]
desc = "Search and fetch Better Auth docs (version-aware: resolve the project's version first)."
tools = "search_docs, get_doc"
[mcp.siderolabs-docs]
desc = "Search the Sidero Labs docs (Talos Linux, Omni); pairs with the siderolabs skill."
tools = "search_sidero_documentation, query_docs_filesystem_sidero_documentation"
[mcp.coolify]
desc = "Self-hosted Coolify PaaS at deploy.matherly.net. Only loaded inside ~/dev/coolify."
[mcp.azure]
desc = "Azure MCP: 70+ tools covering nearly every Azure service (ARM, AKS, App Service, Functions, Cosmos, SQL, Key Vault, Monitor, pricing, quotas, best practices, azd/az CLI generation)."
tools = "one tool per service, e.g. aks, appservice, cosmos, keyvault, monitor, pricing, deploy, get_azure_bestpractices, extension_cli_generate"
[mcp.browser-use]
desc = "Browser Use: CDP control of your Chrome (logged-in session) or a cloud browser, from Python snippets. Use it for interaction, scraping or bot-protected pages; plain fetch covers public pages."
tools = "browser_exec, browser_screenshot"
[mcp.chrome-devtools]
desc = "Chrome DevTools protocol: navigate, click, fill, snapshot the DOM, and inspect console and network. Also performance traces, Lighthouse, heap snapshots. Best tool for debugging web apps."
tools = "navigate_page, click, fill_form, take_snapshot, take_screenshot, list_console_messages, list_network_requests, performance_start/stop_trace, lighthouse_audit, take_heapsnapshot"
[mcp.cloudflare]
desc = "Cloudflare API and docs: search docs, execute account API operations."
tools = "docs, search, execute"
[mcp.logfire]
desc = "Pydantic Logfire observability: SQL over traces/logs/metrics, exception issues, dashboards, alerts, managed prompts/variables. Tools you lack token scope for are hidden."
tools = "query_run, query_schema_reference, issue_list/get, dashboard_*, alert_*, prompt_*, variable_*, local_dev_session"
[mcp.microsoft-learn]
desc = "Official Microsoft/Azure docs: search, code samples, full-page fetch."
tools = "microsoft_docs_search, microsoft_code_sample_search, microsoft_docs_fetch"
[mcp.github]
desc = "GitHub's hosted MCP (needs GITHUB_PERSONAL_ACCESS_TOKEN). Disabled; the gh CLI covers most needs."
[mcp.grafana]
desc = "Grafana MCP via Docker (needs GRAFANA_URL + service-account token). Disabled."
[mcp.sentry]
desc = "Sentry's hosted MCP (sentry plugin): find orgs/projects, search issues and events, Seer root-cause analysis, update issues. The `sentry` CLI covers the same from Bash."
tools = "search_issues, search_events, get_sentry_resource, analyze_issue_with_seer, update_issue"

[mcp.jean]
desc = "Jean desktop app's MCP server (registered by Jean in ~/.claude.json): its projects, worktrees and chat sessions, plus GitHub/Linear issues, PRs, reviews and merges driven through Jean."
tools = "list_projects, create_worktree, create_session, send_chat_message, create_pull_request, merge_pull_request, run_review"
[mcp.agent-browser]
desc = "agent-browser as an MCP server (installed and registered by Jean): open pages, snapshot for element refs, click, fill, screenshot, tabs. The skills:agent-browser skill drives the same tool as a CLI."
tools = "agent_browser_open, agent_browser_snapshot, agent_browser_click, agent_browser_fill, agent_browser_screenshot"

# ---------- notes on confusable items ----------

[notes]
"voltagent-dev-exp:visual-asset-generator" = "Needs the prompt-to-asset MCP server, which is NOT installed here, so this agent can't do its main job."
"skills:setup-ai-tutor" = "Project-specific: sets up the 'AI Tutor' course repo. Only useful inside that project."
"code-review:code-review" = "Plugin version, different from the built-in /code-review. Prefer the built-in: it has effort levels, ultra, --fix and --comment."
"skill-creator:skill-creator" = "Same skill as anthropic-skills:skill-creator (plugin copy vs claude.ai-synced copy)."
"anthropic-skills:skill-creator" = "claude.ai-synced copy of skill-creator:skill-creator."
"skills:piv-run-full-loop" = "'PIV' = plan → implement → validate (from cole-medin's 'skills' plugin). The piv-* skills are steps in that loop; this one chains them."
"skills:agent-browser" = "A CLI (not MCP) browser driver. Pick chrome-devtools for debugging and browser-use for logged-in scraping."
"skills:drive-screen" = "Controls the whole desktop (any app), not just the browser."
"superpowers:using-superpowers" = "Loaded automatically at session start by a hook. There's no need to invoke it."
"prompt-improver:prompt-improver" = "Fired by a hook when a prompt looks vague. Rarely invoked by hand."
"ponytail:ponytail" = "Always on through a SessionStart hook (level: full). Invoke it only to change level: lite/full/ultra."
"remember:remember" = "Saves a session hand-off to .remember/. Different from auto-memory, which updates CLAUDE.md files."
"auto-memory:init" = "Sets up AUTO-MANAGED CLAUDE.md sections that the plugin keeps in sync after edits."
"modern-web-guidance:modern-web-guidance" = "Says it's MANDATORY for HTML/CSS/client JS. Run it first on any web-platform task."

# ---------- task guide ----------

[[group]]
title = "Review code"
pick = ["code-review", "simplify"]
guide = "Correctness bugs: /code-review (use 'ultra' before a big merge). Cleanup: /simplify. Over-engineering: ponytail-review. Security: see the Security group. Full multi-agent PR pass: pr-review-toolkit:review-pr."
items = ["code-review", "simplify", "pr-review-toolkit:review-pr", "code-review:code-review", "ponytail:ponytail-review", "ponytail:ponytail-audit", "skills:piv-review-changes", "skills:piv-review-pr", "superpowers:requesting-code-review", "superpowers:receiving-code-review", "pr-review-toolkit:silent-failure-hunter", "pr-review-toolkit:pr-test-analyzer", "pr-review-toolkit:type-design-analyzer", "pr-review-toolkit:comment-analyzer", "feature-dev:code-reviewer", "voltagent-qa-sec:code-reviewer", "pr-review-toolkit:code-reviewer", "skills:piv-fix-review-findings", "voltagent-qa-sec:architect-reviewer"]

[[group]]
