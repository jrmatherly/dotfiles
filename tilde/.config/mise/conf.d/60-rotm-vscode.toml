# returnofthemac module `vscode`: VS Code extensions.
#
# Switch it off with `rotm settings set modules.vscode off` (on again with `on`).
# The extensions stay installed, and VS Code itself is in the base.
# `mise bootstrap packages prune --dry-run` lists what no config declares any more.

