# The formulae and casks every install gets, installed and upgraded by
# `mise bootstrap packages` (setup.sh, sysup). The rest are in the modules,
# conf.d/60-rotm-<name>.toml, which `rotm settings` switches off one by one.
#
# - A third-party tap is loaded only when a package names it
#   (`owner/tap/name`); bin/lib/test-packages requires that tap to be listed
#   under [bootstrap.brew.taps] in the same file and caps the list at 5.
# - Every value is "latest": mise installs only current bottles and casks, so a
#   pinned version would be skipped with a warning forever.
# - Removing an entry uninstalls nothing until `mise bootstrap packages prune`
#   (run it with --dry-run first: it removes every undeclared formula).

[bootstrap.brew]
# Keep an app already in /Applications instead of replacing it (a replaced app
# loses its privacy permissions); a different build fails untouched.
# homebrew_metadata stays unset: it would hand every cask back to Homebrew.
adopt = true

[bootstrap.brew.taps]
# Dotfiles framework
"jrmatherly/tap" = "https://github.com/jrmatherly/homebrew-tap.git" # claude-multipass; 60-rotm-menubar.toml declares it too

[bootstrap.packages]
# Dotfiles framework requirements
#
# These tools are wired directly into the zsh/git config in this repo
# (see zsh/init.zsh, zsh/fzf.zsh, zsh/aliases.zsh, zsh/path.zsh, tilde/.gitconfig).
# Removing them will break prompt rendering, fzf previews, git signing, etc.
"brew:ack" = "latest" # Better grep for source code (tilde/.ackrc)
"brew:bat" = "latest" # Output highlighting (better `cat`), used in fzf previews
"brew:btop" = "latest" # Performance monitor (better `top`), config tracked in tilde/.config/btop
"brew:eza" = "latest" # Listing files with info (better `ls`), used in fzf previews
"brew:fastfetch" = "latest" # System info, config tracked in tilde/.config/fastfetch
"brew:fd" = "latest" # Find entries in your filesystem (better `find`), used by fzf
"brew:fzf" = "latest" # Fuzzy file finder, core to zsh/fzf.zsh
"brew:gh" = "latest" # GitHub CLI, config tracked in tilde/.config/gh
"brew:git" = "latest" # Version control
"brew:gnupg" = "latest" # Optional: only needed if you sign commits with GPG instead of SSH
"brew:jrmatherly/tap/claude-multipass" = "latest" # Switch Claude Desktop between claude.ai accounts (github.com/jrmatherly/claude-multipass; Raycast scripts in its share dir)
"brew-cask:jrmatherly/tap/claude-multipass-app" = "latest" # Claude Multipass menu bar app (arm64, macOS 14+)
"brew:lazygit" = "latest" # Full Git management app (zsh `lg` alias)
"brew:pinentry-mac" = "latest" # Securely enter your GPG passphrase (only needed with GPG signing)
"brew:ripgrep" = "latest" # Searching within files (better `grep`), tilde/.ripgreprc
"brew:starship" = "latest" # Prompt manager, tilde/.starship.toml
"brew:tlrc" = "latest" # Community-maintained docs (better `man`), tilde/.tlrc.toml
"brew:trash-cli" = "latest" # keg-only (macOS has its own trash); zsh/path.zsh puts its bin dir on PATH
"brew:zoxide" = "latest" # Convenient and magical navigation (better `cd`)
"brew:zsh" = "latest" # A shell of choice
"brew:zsh-autosuggestions" = "latest" # Fish-like autosuggestions for Zsh
"brew:zsh-fast-syntax-highlighting" = "latest" # Feature-rich syntax highlighting for Zsh
"brew-cask:cmux" = "latest" # Terminal for AI agents, config tracked in tilde/.config/cmux
"brew-cask:codex" = "latest" # OpenAI Codex CLI, config tracked in tilde/.codex
"brew-cask:coteditor" = "latest" # `cot` CLI required: tilde/.gitconfig core.editor, zsh/env.zsh $EDITOR
"brew-cask:ghostty" = "latest" # Config tracked in tilde/.config/ghostty
"brew-cask:visual-studio-code" = "latest" # Main code editor; vscode/User settings symlinked to it
"brew:ruby" = "latest" # mise reads a tap's Ruby definition with Ruby 3+ (macOS ships 2.6); without it status and cask applies fail on claude-multipass-app
"brew:uv" = "latest" # Fast Python package/project manager
"brew:git-lfs" = "latest" # Git Large File Storage
"brew:jq" = "latest" # JSON processor
"brew:minijinja-cli" = "latest" # Jinja2 templates from the CLI (renders VS Code settings: bin/vscode-settings)
