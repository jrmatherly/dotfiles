# Formulae, casks and VS Code extensions, installed and upgraded by
# `mise bootstrap packages` (setup/packages.sh, sysup).
#
# - A third-party tap is loaded only when a package below names it
#   (`owner/tap/name`); bin/lib/test-packages requires that tap to be listed
#   under [bootstrap.brew.taps] and caps the list at 5.
# - Every value is "latest": mise installs only current bottles and casks, so a
#   pinned version would be skipped with a warning forever.
# - Removing an entry uninstalls nothing until `mise bootstrap packages prune`
#   (run it with --dry-run first: it removes every undeclared formula).

[bootstrap.brew]
# Keep an app already in /Applications instead of replacing it (a replaced app
# loses its privacy permissions); a different build fails untouched.
# homebrew_metadata stays unset: it would hand every cask back to Homebrew.
adopt = true

[bootstrap.brew.taps]
# Dotfiles framework
"jrmatherly/tap" = "https://github.com/jrmatherly/homebrew-tap.git" # claude-multipass

# Cloud / infra
"kubestellar/tap" = "https://github.com/kubestellar/homebrew-tap.git" # kubestellar-deploy / kubestellar-ops
"skyhook-io/tap" = "https://github.com/skyhook-io/homebrew-tap.git" # radar (Kubernetes visibility)

# Fonts
"bramstein/webfonttools" = "https://github.com/bramstein/homebrew-webfonttools.git"

[bootstrap.packages]
# Fonts
"brew-cask:font-anonymice-nerd-font" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest" # VS Code fallback; its main font, Iosevka Code, has no cask: bin/install-iosevka-code
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:font-profont-nerd-font" = "latest"
"brew-cask:font-sauce-code-pro-nerd-font" = "latest"
"brew-cask:font-tinos-nerd-font" = "latest"
"brew-cask:font-ubuntu-nerd-font" = "latest"

