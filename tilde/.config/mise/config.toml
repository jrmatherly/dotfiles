# Global mise configuration — symlinked to ~/.config/mise/config.toml
# https://mise.jdx.dev/configuration.html

[tools]
# Several versions per tool: all get installed, the FIRST is the default on
# PATH. Projects select another via `.nvmrc` / `.python-version` / `mise.toml`,
# or run one ad hoc: `mise exec node@22 -- node -v`.
#
# Node: 24 (Active LTS) by default — pinned rather than the `lts` alias, which
# moves to 26 when it becomes LTS in October 2026. 22 = Maintenance LTS,
# 26 = Current.
node = ["24", "22", "26"]
# Global `tsc` for scratch files — projects pin `typescript` in their own
# devDependencies (`pnpm exec tsc`). Held at major 6 while most projects are
# still on it; bump to "7" once TS 7 is the norm.
"npm:typescript" = "6"
# CodeGraph — code-graph CLI + MCP server for AI agents
# (https://github.com/colbymchenry/codegraph). Upgrade with `mise upgrade`,
# not `codegraph upgrade`. setup/misc.sh wires it into Claude Code
# (`codegraph install --target claude`); indexing a repo (`codegraph init`) is
# a manual step.
"npm:@colbymchenry/codegraph" = "latest"
# REA (https://github.com/morluto/rea) — reverse-engineering MCP server and
# CLI (`rea`) that drives the Brewfile's Ghidra and Hopper; setup/misc.sh
# registers `rea mcp` with Claude Code. It ships several releases a day, so
# mise's default 24 h release-age cutoff would hold `latest` a version or two
# behind; shortened to 6 h for this tool. The cutoff also screens the tool's
# transitive dependencies (mise passes it to its embedded npm client), which
# is why it is not 0: a few hours still catches a pulled release. npm's own
# `min-release-age=7` from setup/misc.sh never applies to mise installs.
"npm:rea-agents" = { version = "latest", minimum_release_age = "6h" }
# Global npm CLIs — installed by mise (not `npm install -g`), so they survive
# switching the default Node and upgrade with `mise upgrade` (within the major).
"npm:serverless" = "4"
"npm:@antfu/ni" = "30"
# Language servers for Terax's editor (Brewfile cask `terax`; the non-npm ones,
# rust-analyzer, zls, lua-language-server and ruby-lsp, are formulae there).
# Terax looks each preset's executable up on the PATH of a non-interactive
# login shell (`$SHELL -l -c '/usr/bin/env -0'`, 10 s timeout, else the bare
# GUI PATH), which tilde/.zprofile seeds with mise's shims; each preset is
# then switched on in Terax's settings. Trailing comments name the executable
# where it differs from the package.
# typescript-language-server finds TypeScript in the project's node_modules or
# by Node resolution from its own install dir, which walks up to mise's data
# dir; setup/misc.sh and bin/upup link the `npm:typescript` above there.
"npm:typescript-language-server" = "6"
"npm:pyright" = "1" # `pyright-langserver`; Terax's Ruff preset uses the Brewfile's `ruff server`
"npm:intelephense" = "1"
"npm:yaml-language-server" = "1"
"npm:bash-language-server" = "5"
"npm:vscode-langservers-extracted" = "4" # `vscode-json-language-server`, `vscode-css-language-server`, `vscode-html-language-server`
# svelte-language-server needs svelte ^4.2.19; 4.2.20 is a 2025 backport
# published without provenance after 5.0.0 had it, which mise's no-downgrade
# trust check rejects. Reviewed upstream (commit c1eb348 has the trail); drop
# the exemption once the server depends on a svelte release with provenance.
"npm:svelte-language-server" = { version = "0", trust_policy_excludes = ["svelte@4.2.20"] } # `svelteserver`
"npm:@vue/language-server" = "3" # `vue-language-server`
# Python for VS Code and scripts — Homebrew's python@3.x only exists as a
# dependency of other formulae (pipx, awscli…), so don't rely on it. Projects
# pin their own with `.python-version` / `mise.toml`; uv manages their venvs.
# Every version's bin dir is on PATH, so `python3.11`…`python3.15` all work
# directly; plain `python`/`python3` is 3.14. 3.15 is pinned to its release
# candidate — mise's "3.15" won't match a prerelease — so change it to "3.15"
# once 3.15.0 is out (October 2026).
python = ["3.14", "3.11", "3.12", "3.13", "3.15.0rc2"]
# Bun — runs the jstack plugin's j-mode scripts (jrmatherly/skills). Its
# package-manager settings are in tilde/.bunfig.toml; crash reports are off
# via DO_NOT_TRACK (zsh/env.zsh).
bun = "latest"

[settings]
# Read `.nvmrc` / `.node-version` (like nvm and fnm) and `.python-version`
# (like pyenv/uv) — off by default in mise. This repo's own .nvmrc (`lts/*`)
# relies on it, as does `bin/nnn`.
# https://mise.jdx.dev/configuration/settings.html
idiomatic_version_file_enable_tools = ["node", "python"]
