# Global mise configuration — symlinked to ~/.config/mise/config.toml
# https://mise.jdx.dev/configuration.html

[tools]
# Several versions per tool: all get installed, the FIRST is the default on
# PATH. Projects select another via `.nvmrc` / `.python-version` / `mise.toml`,
# or run one ad hoc: `mise exec node@22 -- node -v`.
#
# Node: 24 by default, pinned rather than the `lts` alias (26 from
# 2026-10-28). 22 and 24 are Maintenance LTS. Move the default to 26 once
# projects do.
node = ["24", "22", "26"]
# From mise's registry, not a Homebrew tap: the taps these came from ship no
# Apple Silicon bottle, and the registry carries the same upstream release
# binaries (identity checked 2026-11-09: spec D6, plan A4).
hunk = "latest" # Git pager used by tilde/.gitconfig, lazygit and gh
# Python for VS Code and scripts — Homebrew's python@3.x only exists as a
# dependency of other formulae (pipx, awscli…), so don't rely on it. Projects
# pin their own with `.python-version` / `mise.toml`; uv manages their venvs.
# Every version's bin dir is on PATH, so `python3.11`…`python3.15` all work
# directly; plain `python`/`python3` is 3.14. Renovate leaves this list alone
# (renovate.json), so new minors are added here by hand.
python = ["3.14", "3.11", "3.12", "3.13", "3.15"]

[settings]
# Read `.nvmrc` / `.node-version` (like nvm and fnm) and `.python-version`
# (like pyenv/uv) — off by default in mise. This repo's own .nvmrc (`lts/*`)
# relies on it, as does `bin/nnn`.
# https://mise.jdx.dev/configuration/settings.html
idiomatic_version_file_enable_tools = ["node", "python"]

[settings.github]
# gh keeps its token in the macOS Keychain, where mise's own reader (gh's
# hosts.yml) cannot see it, so without this every mise call is anonymous and
# tap and release lookups run out of GitHub's 60 calls an hour. mise runs the
# command at most once per mise command, only when it needs GitHub, and falls
# back to anonymous when gh is missing or logged out. The absolute path is for
# shells whose PATH lacks the prefix. Global-only: a project config cannot set it
# https://mise.jdx.dev/dev-tools/github-tokens.html#gh-keyring
credential_command = '"${HOMEBREW_PREFIX:-/opt/homebrew}/bin/gh" auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.url_replacements]
# Warp's cask URL answers 404 unless the User-Agent starts with `Homebrew`, and
# mise has no setting for its own (measured on 2026.11.6). This sends the request
# to the file that URL redirects to; the cask's checksum still verifies it.
# Delete it once `brew-cask:warp` installs without it.
# https://mise.jdx.dev/url-replacements.html
'regex:^https://app\.warp\.dev/download/brew\?version=([^&]+)&package=dmg$' = "https://releases.warp.dev/stable/$1/Warp.dmg"
