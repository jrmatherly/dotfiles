# Read by setup/macos-extras.sh, which set-defaults runs. Stored in the git-ignored override file.

[[setting]]
id = "macos.screenshots"
section = "macOS (this Mac)"
label = "Apply the screenshot preferences"
help = "Save to the Desktop as PNG named Shot, no window shadow, pointer shown. Off leaves them as they are. Applied by the next set-defaults."
kind = "env"
key = "DOTFILES_MACOS_SCREENSHOTS"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.time_machine_new_disks"
section = "macOS (this Mac)"
label = "Stop Time Machine offering new disks"
help = "Time Machine stops asking to use each new drive for backups. Off leaves the prompt as it is. Applied by the next set-defaults."
kind = "env"
key = "DOTFILES_MACOS_TIME_MACHINE_NEW_DISKS"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.textedit"
section = "macOS (this Mac)"
label = "Make TextEdit default to plain text"
help = "New documents are plain text, opened and saved as UTF-8. Off leaves TextEdit as it is. Applied by the next set-defaults."
kind = "env"
key = "DOTFILES_MACOS_TEXTEDIT"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.software_update"
section = "macOS (this Mac)"
label = "Turn on automatic macOS updates"
help = "Daily check, background download, security and system data installs. Turn off on a Mac whose updates are managed by MDM. Applied by the next set-defaults."
kind = "env"
key = "DOTFILES_MACOS_SOFTWARE_UPDATE"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.firewall"
section = "macOS (this Mac)"
label = "Turn on the firewall and stealth mode"
help = "On by default. set-defaults asks for your password when the firewall or stealth mode is off. Turn this off on a Mac whose firewall is managed by MDM. Turning it off leaves the firewall as it is."
kind = "env"
key = "DOTFILES_MACOS_FIREWALL"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.hidpi"
section = "macOS (this Mac)"
label = "Offer HiDPI display modes"
help = "Needs your password and a restart. Turning this off later leaves the modes on."
kind = "env"
key = "DOTFILES_MACOS_HIDPI"
type = "bool"
true_value = "1"
access = "rw"

[[setting]]
id = "macos.disable_time_machine"
section = "macOS (this Mac)"
label = "Turn off Time Machine backups"
help = "On by default: the next set-defaults stops all Time Machine backups on this Mac, and asks for your password when backups are on. If this Mac uses Time Machine, turn this off before running set-defaults. Turning it off later does not turn backups back on: use System Settings."
kind = "env"
key = "DOTFILES_MACOS_DISABLE_TIME_MACHINE"
type = "bool"
true_value = "1"
default = "1"
access = "rw"

[[setting]]
id = "macos.computer_name"
section = "macOS (this Mac)"
label = "Computer name"
help = "set-defaults renames the Mac when this or the local hostname differs from the Mac's, and asks for your password. Empty leaves the name alone."
kind = "env"
key = "DOTFILES_MACOS_COMPUTER_NAME"
type = "string"
access = "rw"

[[setting]]
id = "macos.local_hostname"
section = "macOS (this Mac)"
label = "Local hostname"
help = "The Bonjour name (name.local). Used only when the computer name is set. Empty derives it from the computer name: lower case, other characters as hyphens."
kind = "env"
key = "DOTFILES_MACOS_LOCAL_HOSTNAME"
type = "string"
access = "rw"

[[setting]]
id = "packages.formulae"
section = "Packages"
label = "Formulae"
help = "Command-line packages mise installs into /opt/homebrew. Edit tilde/.config/mise/conf.d/30-packages.toml to add one. Removing an entry uninstalls nothing until `mise bootstrap packages prune`."
kind = "package"
key = "brew"
type = "string"
access = "ro"

[[setting]]
id = "packages.casks"
section = "Packages"
label = "Apps and fonts"
help = "Casks mise installs. No version pins. A cask that Homebrew put there is left alone until migrated."
kind = "package"
key = "brew-cask"
type = "string"
access = "ro"

[[setting]]
id = "packages.vscode"
section = "Packages"
label = "VS Code extensions"
help = "Installed with the code CLI by the plugin in mise-plugins/vscode."
kind = "package"
key = "vscode"
type = "string"
access = "ro"

[[setting]]
id = "packages.tools"
section = "Packages"
label = "mise tools"
help = "Runtimes and CLIs from [tools] in tilde/.config/mise/config.toml."
kind = "package"
key = "tools"
type = "string"
access = "ro"

[[setting]]
id = "dotfiles.links"
section = "Dotfiles"
label = "Links and copies in the home folder"
help = "What mise dotfiles status reports for conf.d/40-dotfiles.toml. Run dotfiles-settings apply dotfile to create what is missing. A real file in the way stops the apply and nothing is replaced."
kind = "dotfile"
key = "all"
type = "string"
default = ""
access = "ro"

[[setting]]
id = "ui.claude_panel"
section = "Agents"
label = "Claude Code settings panel"
help = "Turns the planned Claude Code panel on. Nothing reads this yet."
kind = "env"
key = "DOTFILES_UI_CLAUDE_PANEL"
type = "bool"
true_value = "1"
default = ""
access = "rw"
