# macOS preferences declared in tilde/.config/mise/conf.d/20-macos.toml. Exposed when a settings pane or
# docs/macos settings.md has it, its type is bool, int, string or a fully named enum, and it is not security-sensitive.

[[setting]]
id = "macos.dock.autohide"
section = "macOS (tracked in git)"
label = "Hide the Dock automatically"
help = "The Dock slides away until the pointer reaches its edge."
kind = "macos-default"
key = "com.apple.dock/autohide"
type = "bool"
true_value = "true"
access = "rw"

[[setting]]
id = "macos.dock.tilesize"
section = "macOS (tracked in git)"
label = "Dock icon size"
help = "In pixels."
kind = "macos-default"
key = "com.apple.dock/tilesize"
type = "int"
access = "rw"

[[setting]]
id = "macos.dock.show_recents"
section = "macOS (tracked in git)"
label = "Show suggested and recent apps in the Dock"
help = "Adds a section of apps you are not keeping in the Dock."
kind = "macos-default"
key = "com.apple.dock/show-recents"
type = "bool"
true_value = "true"
access = "rw"

[[setting]]
id = "macos.dock.minimize_to_application"
section = "macOS (tracked in git)"
label = "Minimize windows into the app icon"
help = "Off puts each minimized window at the right of the Dock."
kind = "macos-default"
key = "com.apple.dock/minimize-to-application"
type = "bool"
true_value = "true"
access = "rw"

[[setting]]
id = "macos.dock.mineffect"
