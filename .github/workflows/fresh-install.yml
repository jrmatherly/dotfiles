name: fresh-install

# The two paths a new Mac takes, on a runner without Homebrew: ./setup.sh from
# a clone, and the install line that needs no clone (mise fetches the copy).
# Manual only (gh workflow run fresh-install.yml): it installs every formula,
# cask, extension and tool, and runs the bootstrap task. A hosted runner is not a clean Mac; the full proof is the
# VM run in plan A6's Task 6
on: workflow_dispatch

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, which the status | jq checks rely on
    shell: bash

jobs:
  fresh-install:
    # macOS 27 preview image. Fallback: macos-26 (plan A4 Task 8 Step 8)
    runs-on: xcode-27
    # Hosted jobs stop at 360 minutes; a pkg installer waiting on a prompt must
    # not hold the job that long. Lowered after the first measured run
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        path: [clone, installed]
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        run: |
          sw_vers -productVersion
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      # Without the runner's Homebrew, mise creates the prefix and no formula
      # counts as already installed. Homebrew's uninstall.sh is not used: the rm
      # makes it pointless, and it would be piped from an unpinned HEAD
      - name: Remove Homebrew
        run: |
          sudo rm -rf /opt/homebrew
          test ! -e /opt/homebrew
          if command -v mise; then exit 1; fi
          df -h /
          du -sh ~/Library/Caches/mise/system-brew/bottles ~/Library/Caches/mise/system-brew/casks 2> /dev/null || true
      # A file here that conf.d/40-dotfiles.toml links would stop setup's dotfiles apply
      - name: Home before setup
        run: ls -la ~
      # The runner image ships these and a new Mac has neither
      - name: Move the runner's own dotfiles aside
        run: for f in ~/.bash_profile ~/.gitconfig; do [ ! -e "$f" ] || mv "$f" "$f.runner"; done
      # The command a new Mac runs. Without a terminal it skips sudo -v, the
      # Enter prompt and the script log, and mise elevates with the runner's
      # passwordless sudo. It installs mise, links the dotfiles, applies formulae and casks
      # (printing free space after each), runs mise bootstrap without macOS
      # preferences, mise install and the task, then applies the extensions. A
      # failed bootstrap part or task fails this step. Exit 2 means only some
      # packages or tools failed: the steps below judge each one, so the
      # tolerated royal-tsx miss alone does not fail the job
      - name: setup.sh
        if: matrix.path == 'clone'
        # --skip user: chsh asks for the account's password, which a runner has none of
        run: |
          rc=0
          ./setup.sh -y --skip-codegraph -- --skip user || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
      # What a stranger does first. ~/.local/bin stays off PATH here: the
      # install line must work without it, as on a new Mac
      - name: Install mise
        if: matrix.path == 'installed'
        run: curl -fsSL https://mise.run | sh
      # The README's install line, following the branch under test instead of
      # stable. The checkout from actions/checkout is not used on this path
      - name: Install line
        if: matrix.path == 'installed'
        env:
          REF: ${{ github.ref_name }}
        run: |
          rc=0
          { ~/.local/bin/mise -E rotm-installed bootstrap --from "https://github.com/jrmatherly/returnofthemac.git?ref=$REF" --config-dir tilde/.config/mise --save-env --only final-hook \
            && ~/.local/share/mise/bootstrap-repo/setup.sh -y --skip-codegraph -- --skip user; } || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
      - name: Disk after setup
        if: always()
        run: |
          df -h /
          du -sh ~/Library/Caches/mise/system-brew/bottles ~/Library/Caches/mise/system-brew/casks 2> /dev/null || true
          du -sh /opt/homebrew/Cellar 2> /dev/null || true
          du -sh /opt/homebrew/Caskroom /Applications 2> /dev/null || true
          du -sh ~/.vscode/extensions 2> /dev/null || true
          du -sh ~/.local/share/mise/installs 2> /dev/null || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          # The same folder on both paths, through the link setup made
          echo "MISE_CONFIG_DIR=$HOME/.config/mise" >> "$GITHUB_ENV"
      - name: mise installed
        run: |
          test -x "$HOME/.local/bin/mise"
          mise --version
      # From RUNNER_TEMP so the repo's .nvmrc adds nothing. CodeGraph is
      # disabled as in the setup.sh step
      - name: Tools installed
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          missing=$(MISE_DISABLE_TOOLS=npm:@colbymchenry/codegraph mise ls --missing --json | jq -r 'keys[]')
          [ -z "$missing" ] || { echo "::error::tools not installed: $(paste -sd, - <<< "$missing")"; exit 1; }
      # setup.sh's mise install installed the tools. The postinstall
      # hooks in config.toml write the completions (spec decision 10)
      - name: Completions written
        run: |
          for f in _flux _talosctl _sentry; do
            test -s "$HOME/.cache/dotfiles/completions/$f" || { echo "::error::completion $f missing"; exit 1; }
          done
      - name: Formulae installed
        if: always()
        run: |
          status=$(mise bootstrap packages status --json)
          jq -r '.brew.packages[] | select(.state != "installed") | "\(.package) \(.state)"' <<< "$status"
          jq -e '[.brew.packages[] | select(.state != "installed")] | length == 0' <<< "$status"
      # Not status --missing: it exits 0 when a manager is unavailable and its
      # packages are skipped
      - name: Casks and extensions installed
        if: always()
        run: |
          # The one tolerated miss: its dmg carries a licence agreement, which mise can only accept from a terminal (conf.d/60-rotm-apps.toml)
          tolerated='brew-cask royal-tsx'
          status=$(mise bootstrap packages status --json)
          missing=$(jq -r '["brew-cask", "vscode"][] as $m | .[$m] | if .available then .packages[] | select(.state != "installed") | "\($m) \(.package) \(.state)" else "\($m) unavailable" end' <<< "$status")
          echo "$missing"
          unexpected=$(grep -v "^$tolerated " <<< "$missing" || true)
          [ -z "$unexpected" ] || { echo "::error::not installed: $(paste -sd, - <<< "$unexpected")"; exit 1; }
      - name: Package table
        if: always()
        run: |
          mise bootstrap packages status
          mise ls --missing
      # For the log only: the run never applies macOS preferences, so those
      # entries differ. From RUNNER_TEMP so the repo's .nvmrc changes nothing
      - name: Bootstrap status
        if: always()
        working-directory: ${{ runner.temp }}
        run: MISE_DISABLE_TOOLS=npm:@colbymchenry/codegraph mise bootstrap status --missing || true
      - name: The copy is an installed one
        if: matrix.path == 'installed'
        run: test "$("$HOME/dotfiles/bin/lib/rotm-mode")" = installed
      # The update path, right after an install: nothing to fetch, setup runs again
      - name: rotm update
        if: matrix.path == 'installed'
        run: |
          rc=0
          "$HOME/dotfiles/bin/rotm" update -y --skip-codegraph -- --skip user || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
      # An install, an update and every check above wrote no tracked file into the copy
      - name: The copy is clean
        if: matrix.path == 'installed'
        run: |
          git -C "$HOME/dotfiles" status --porcelain --untracked-files=no
          test -z "$(git -C "$HOME/dotfiles" status --porcelain --untracked-files=no)"
