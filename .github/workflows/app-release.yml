name: app-release

on:
  push:
    tags: ['app-v*']

permissions:
  contents: read

jobs:
  # Builds, signs and notarizes with a read-only token; only release below can write
  build:
    runs-on: macos-26
    # Two notarytool waits of up to 30 minutes each, plus the build
    timeout-minutes: 90
    env:
      # A missing or untrusted identity fails the job instead of shipping an unsigned DMG
      MACOS_SIGN_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against origin/main
          fetch-depth: 0
      - name: Check the tag and the release secrets
        env:
          HAS_SECRETS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          version=$(cat app/VERSION)
          if [ "$GITHUB_REF_NAME" != "app-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME differs from app/VERSION $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main"
            exit 1
          fi
          if [ "$HAS_SECRETS" != true ]; then
            echo "::error::MACOS_CERT_P12, MACOS_CERT_PASSWORD and the three APPLE_API_* secrets are all required to publish a signed, notarized DMG"
            exit 1
          fi
      # Not pnpm check, which needs mise, uv, a newer Python and packages this job
      # does not install; the tagged commit already passed it on main
      - run: swift test --package-path app
      # Before the certificate is imported; the check forces an unsigned build anyway
      - run: bash bin/lib/test-app-build
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # The runner's bash is 3.2, so no mapfile.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"\(.*\)"$/\1/')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$P12"
      - name: Build, sign and notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash app/scripts/build-app.sh --dmg
      # The bytes users get, after build-app.sh's staging copy
      - name: Check the app inside the DMG
        run: |
          mount=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" app/dist/*.dmg
          # || true, or a busy detach would fail a good build after it notarized
          trap 'hdiutil detach -quiet -force "$mount" || true' EXIT
          codesign --verify --deep --strict "$mount/Return of the Mac.app"
          spctl -a -vv "$mount/Return of the Mac.app"
          xcrun stapler validate "$mount/Return of the Mac.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            app/dist/*.dmg
            app/dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    # Pinned, as check.yml pins its runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: Upload the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The cask pins the published DMG's sha256, so an asset is never replaced. A rebuild
          # is not byte-identical, so a leftover .sha256 would not match a new DMG either.
          if existing=$(gh release view "$TAG" --json assets -q '.assets[].name'); then
            for f in dist/*.dmg dist/*.sha256; do
              if grep -qxF "$(basename "$f")" <<< "$existing"; then
                echo "::error::release $TAG already has $(basename "$f"); delete the asset by hand to republish"
                exit 1
              fi
            done
            gh release upload "$TAG" dist/*.dmg dist/*.sha256
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 --generate-notes
          fi
