name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are noise; every main commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The scripts target macOS: /bin/bash 3.2 and zsh.
    # Pinned: macos-latest moves without notice (Renovate proposes bumps)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: it reads package.json's packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # mise's python is not installed here, so bin/lib/check runs the catalog
      # test with plain python3, which must be 3.11+ for tomllib
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # The floor in setup/mise-floor.sh (bin/lib/test-override-env checks they
      # match). install: false, because the repo's global config is not linked here
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install: false
      # No lockfile to key a cache on until the settings package lands
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Named packages install without any config; mise pours Homebrew's bottles
      # itself. shellcheck, actionlint, minijinja-cli and rtk are what pnpm check runs
      - run: mise bootstrap packages apply --yes brew:actionlint brew:shellcheck brew:minijinja-cli brew:rtk
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      # Every formula, cask, tap and dependency in the package list resolves,
      # in the base and in every module. An empty prefix
      # (MISE_SYSTEM_BREW_PREFIX: read by mise's source and its own tests, not
      # documented) so the runner's Homebrew counts for nothing, and the package
      # fragments alone with their [tools] tables dropped, because the whole
      # config dir installs its pythons first. Downloads metadata only. VS Code
      # ids are not checked: the plugin is not linked here and no dry run asks
      # VS Code. A second dry run with one module off must not name its formulae
      - name: Package list dry run
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          d=$RUNNER_TEMP/packages-dry-run
          mkdir -p "$d/config/conf.d" "$d/prefix"
          for f in tilde/.config/mise/conf.d/30-packages.toml tilde/.config/mise/conf.d/60-rotm-*.toml; do
            awk '/^\[tools\]/{skip=1; next} /^\[/{skip=0} !skip' "$f" > "$d/config/conf.d/$(basename "$f")"
          done
          # Tap definitions are read with Ruby 3+, and a dry run never provisions one
          ruby -e 'exit(RUBY_VERSION.to_i >= 3 ? 0 : 1)' || { echo "::error::no Ruby 3+ first on PATH: $(command -v ruby) $(ruby -v)"; exit 1; }
          modules=$PWD/bin/lib/rotm-modules
          cd "$d"
          export MISE_CONFIG_DIR=$d/config MISE_TRUSTED_CONFIG_PATHS=$d/config \
            MISE_DATA_DIR=$d/data MISE_STATE_DIR=$d/state MISE_CACHE_DIR=$d/cache \
            MISE_SYSTEM_BREW_PREFIX=$d/prefix
          mise bootstrap packages apply --dry-run
          "$modules" set security off
          mise bootstrap packages apply --dry-run 2>&1 | tee off.log
          if grep -wE 'nmap|hydra|ghidra' off.log; then echo "::error::security is off and its formulae are still in the dry run"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
