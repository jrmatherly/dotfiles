name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are noise; every main commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The scripts target macOS: /bin/bash 3.2, zsh, and Homebrew for the
    # Brewfile parse step that bin/lib/check skips without brew
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: it reads package.json's packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No mise here, so bin/lib/check runs the catalog test with plain
      # python3, which must be 3.11+ for tomllib
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: brew install shellcheck minijinja-cli
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
